name: CMake

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: true
          - os: ubuntu-latest
            compiler: intel
            version: '2023.2'
            shared: false
          - os: ubuntu-latest
            compiler: intel
            version: '2023.2'
            shared: true
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: true

    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      
      - name: Show Fortran compiler version
        run: ${{ env.FC }} --version
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Install BLAS/LAPACK dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libblas-dev liblapack-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew update
            brew install openblas
          elif [ "${{ runner.os }}" = "Windows" ]; then
            C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-blas mingw-w64-x86_64-lapack
            echo "MSYS2_MINGW_BIN=/c/msys64/mingw64/bin" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake
        shell: bash
        run: |
          CMAKE_OPTIONS=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            -DCMAKE_Fortran_COMPILER=${{ env.FC }}
            -DCMAKE_C_COMPILER=${{ env.CC }}
            -DBUILD_TESTING=TRUE
            -DBUILD_SHARED_LIBS=${{ matrix.shared && 'TRUE' || 'FALSE' }}
          )
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
            CMAKE_OPTIONS+=( -G "MinGW Makefiles" )
          fi
          cmake "${CMAKE_OPTIONS[@]}"
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Build with CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
          fi
          cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test with CMake
        shell: bash
        working-directory: build
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
          fi
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Install with CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
          fi
          cmake --install build --prefix ${{ github.workspace }}/install --config ${{ env.BUILD_TYPE }}

      - name: Verify install with CMake consumer
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
          fi

          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(nonlin_consumer LANGUAGES Fortran)

          find_package(nonlin CONFIG REQUIRED)

          add_executable(nonlin_consumer main.f90)
          target_link_libraries(nonlin_consumer PRIVATE nonlin::nonlin)
          EOF

          cat > consumer/main.f90 <<'EOF'
          program main
            use nonlin
            print *, "nonlin package found"
          end program main
          EOF

          CMAKE_OPTIONS=(
            -S consumer
            -B consumer/build
            -DCMAKE_Fortran_COMPILER=${{ env.FC }}
            -DCMAKE_C_COMPILER=${{ env.CC }}
          )
          if [ "${{ runner.os }}" = "Windows" ]; then
            INSTALL_PREFIX="${GITHUB_WORKSPACE//\\//}/install"
            CMAKE_OPTIONS+=( -G "MinGW Makefiles" )
          else
            INSTALL_PREFIX="${{ github.workspace }}/install"
          fi
          CMAKE_OPTIONS+=( -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX}" )
          cmake "${CMAKE_OPTIONS[@]}"
          cmake --build consumer/build
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}
